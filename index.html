<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:dark}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: estética de Neo-Tóquio. Preto fosco, vermelho-sinal e branco de papel. Painéis chanfrados como quadros de mangá, HUD no topo, abas em faixa vermelha inclinada. Visual único e escuro. */
:root {
  --void: #0a0909;
  --panel: #151212;
  --panel-2: #1d1919;
  --line: #3b3131;
  --fg: #f1ebdd;
  --dim: #a1968a;
  --red: #e8201f;
  --red-deep: #4a0e0e;
  --paper: #f1ebdd;
  --amber: #f0b429;
  --good: #8fd19e;
  --bad: #ff6a2a;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Zen Kaku Gothic New", "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
html, body { background: var(--void); }
body {
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 0 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(circle at 92% -6%, rgba(232,32,31,.28) 0 120px, transparent 121px),
    radial-gradient(700px 420px at 100% 0%, rgba(232,32,31,.10), transparent 70%),
    var(--void);
  min-height: 100%;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .5;
  background: radial-gradient(rgba(241,235,221,.07) 1px, transparent 1.5px) 0 0 / 5px 5px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--void);
}
.wrap { max-width: 880px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; margin: 0; text-wrap: balance; letter-spacing: .03em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
input, select, textarea { font-size: 16px; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }

/* HUD */
.hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: linear-gradient(var(--void) 88%, rgba(10,9,9,0));
  padding: 10px 0 10px;
}
.strip { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
.strip .jp { color: var(--red); font-weight: 700; letter-spacing: .3em; font-size: 12px; }
.hud-row { display: flex; align-items: center; gap: 16px; }
.badge {
  flex: none; width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center;
  background: var(--red); color: var(--paper); font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1;
  box-shadow: 0 0 0 3px var(--void), 0 0 0 5px var(--paper);
}
.hud-main { flex: 1; min-width: 0; }
.hud-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rank { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.1; }
.rank small { font-family: var(--f-mono); font-size: 11px; color: var(--red); font-weight: 600; letter-spacing: .14em; margin-left: 10px; }
.xpbar { height: 14px; background: var(--panel-2); border: 1px solid var(--paper); margin: 6px 0 5px; position: relative; overflow: hidden; }
.xpbar > i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(115deg, var(--red) 0 8px, #b81716 8px 12px); transition: width .5s ease; }
.hud-meta { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 12px; color: var(--dim); }
.hud-meta b { color: var(--fg); font-weight: 600; }
.hud-meta .cr b { color: var(--amber); }
.hp-ok b { color: var(--good); } .hp-low b { color: var(--bad); }

/* Tabs */
.tabs { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; padding-bottom: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; background: transparent; border: 1px solid var(--line); padding: 8px 18px;
  font-family: var(--f-display); font-weight: 800; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
  clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
}
.tab[aria-selected="true"] { background: var(--red); border-color: var(--red); color: var(--paper); }
.tab:hover { color: var(--fg); border-color: var(--dim); }
.tab[aria-selected="true"]:hover { color: var(--paper); border-color: var(--red); }

/* Panels */
main { padding-top: 18px; display: grid; gap: 18px; }
.panel {
  position: relative; background: var(--panel); border: 1px solid var(--line); padding: 18px 16px 16px; min-width: 0;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
}
.panel::before { content: ""; position: absolute; top: 0; left: 0; width: 44px; height: 4px; background: var(--red); }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.ph h2 { font-size: 20px; letter-spacing: .12em; text-transform: uppercase; }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.empty { color: var(--dim); padding: 14px 0; font-size: 14px; }
.banner { border: 1px solid var(--amber); background: repeating-linear-gradient(135deg, rgba(240,180,41,.10) 0 10px, transparent 10px 20px); padding: 10px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
.banner span { min-width: 0; flex: 1 1 240px; color: var(--amber); }

/* Buttons */
.btn {
  background: transparent; border: 1px solid var(--paper); color: var(--paper); padding: 7px 16px;
  font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .12em; text-transform: uppercase;
}
.btn:hover { background: rgba(241,235,221,.12); }
.btn.pri { background: var(--red); border-color: var(--red); color: var(--paper); }
.btn.pri:hover { background: #ff3b39; }
.btn.warn { border-color: var(--bad); color: var(--bad); }
.btn.warn:hover { background: rgba(255,106,42,.14); }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.ghost { background: none; border: 0; color: var(--dim); padding: 4px 8px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; }
.ghost:hover { color: var(--paper); }

/* List items */
.list { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--line); min-width: 0; }
.item.done { opacity: .5; }
.item.done .ttl { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
.chk {
  flex: none; width: 30px; height: 30px; border: 2px solid var(--paper); background: transparent; display: grid; place-items: center;
  color: transparent; font-weight: 700; font-size: 17px; line-height: 1; border-radius: 0;
}
.chk:hover { background: rgba(241,235,221,.14); }
.done .chk { background: var(--red); border-color: var(--red); color: var(--paper); }
.body { flex: 1; min-width: 0; }
.ttl { font-weight: 500; overflow-wrap: anywhere; }
.sub { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 11px; color: var(--dim); margin-top: 3px; letter-spacing: .05em; }
.sub .xp { color: var(--red); font-weight: 600; } .sub .streak { color: var(--amber); } .sub .late { color: var(--bad); }
.diff { display: inline-flex; gap: 2px; align-items: center; }
.diff i { width: 7px; height: 7px; background: var(--line); display: block; }
.diff i.on { background: var(--red); }
.prog { height: 10px; background: var(--panel-2); border: 1px solid var(--dim); margin: 8px 0 4px; position: relative; }
.prog > i { position: absolute; inset: 0 auto 0 0; background: var(--paper); transition: width .4s; }
.goal { display: grid; gap: 4px; }
.miles { display: grid; gap: 6px; margin-top: 8px; }
.mile { display: flex; gap: 10px; align-items: center; }
.mile .chk { width: 22px; height: 22px; font-size: 13px; }
.mile.done .t { color: var(--dim); text-decoration: line-through; }
.price { font-family: var(--f-mono); color: var(--amber); font-weight: 600; white-space: nowrap; }

/* Heatmap */
.heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.heat i { aspect-ratio: 1; background: var(--panel-2); border: 1px solid var(--line); display: block; }
.heat i[data-l="1"] { background: #5a1514; } .heat i[data-l="2"] { background: #a31a19; } .heat i[data-l="3"] { background: var(--red); }
.heat i.today { outline: 2px solid var(--paper); outline-offset: 1px; }

/* Profile */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--line); }
.stat b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.1; }
.attr { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; margin-bottom: 8px; }
.attr .prog { margin: 0; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.ach { padding: 10px 12px; border: 1px solid var(--line); background: var(--panel-2); opacity: .45; }
.ach.on { opacity: 1; border-color: var(--red); }
.ach b { font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; display: block; }
.ach span { font-size: 12px; color: var(--dim); }
.ladder { display: grid; gap: 4px; font-family: var(--f-mono); font-size: 12px; }
.ladder div { display: flex; justify-content: space-between; padding: 5px 9px; border: 1px solid var(--line); color: var(--dim); }
.ladder .cur { color: var(--paper); border-color: var(--red); background: var(--red-deep); }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; background: var(--void); border: 1px solid var(--dim); padding: 9px 10px; min-width: 0; border-radius: 0;
}
textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
label.f { display: grid; gap: 5px; margin-bottom: 12px; }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.days label { display: flex; position: relative; }
.days input { position: absolute; opacity: 0; }
.days span { border: 1px solid var(--dim); padding: 6px 10px; font-family: var(--f-mono); font-size: 12px; cursor: pointer; }
.days input:checked + span { background: var(--red); color: var(--paper); border-color: var(--red); }
.days input:focus-visible + span { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Diário */
.entry { background: var(--panel-2); border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.entry-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.entry-date { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: .06em; line-height: 1; }
.mood { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 8px; border: 1px solid var(--dim); color: var(--dim); }
.mood[data-m="5"], .mood[data-m="4"] { border-color: var(--good); color: var(--good); }
.mood[data-m="2"] { border-color: var(--amber); color: var(--amber); }
.mood[data-m="1"] { border-color: var(--bad); color: var(--bad); }
.entry-text { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 68ch; }
.entry .push { margin-left: auto; }
.mood-row { display: flex; gap: 6px; flex-wrap: wrap; }
.mood-row label { display: flex; position: relative; }
.mood-row input { position: absolute; opacity: 0; }
.mood-row span { border: 1px solid var(--dim); padding: 6px 10px; font-family: var(--f-mono); font-size: 12px; cursor: pointer; }
.mood-row input:checked + span { background: var(--paper); color: var(--void); border-color: var(--paper); }
.mood-row input:focus-visible + span { outline: 2px solid var(--amber); outline-offset: 2px; }
.dtext { min-height: 180px; }

/* Guia do usuário: mesma identidade, fundo branco */
.guide-btn { background: transparent; border: 1px solid var(--red); color: var(--red); font-family: var(--f-mono); font-weight: 600; font-size: 11px; letter-spacing: .16em; padding: 2px 10px; }
.guide-btn:hover { background: var(--red); color: var(--paper); }
.strip .right { display: flex; align-items: center; gap: 12px; }
#guide .guide {
  --g-bg: #ffffff; --g-fg: #151111; --g-dim: #5e5650; --g-line: #d9d2c8; --g-soft: #f4f1ec; --g-red: #d3161a;
  position: fixed; inset: 0; z-index: 80; overflow-y: auto; background: var(--g-bg); color: var(--g-fg);
  background-image: radial-gradient(rgba(21,17,17,.06) 1px, transparent 1.5px); background-size: 6px 6px;
  color-scheme: light; font-size: 15.5px; line-height: 1.6;
}
.gbar { position: sticky; top: 0; z-index: 2; background: var(--g-red); color: #fff; padding-top: env(safe-area-inset-top, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.gbar-in { max-width: 820px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.gtitle { font-family: var(--f-display); font-weight: 800; font-size: 24px; letter-spacing: .14em; }
.gclose { background: #fff; color: var(--g-red); border: 0; padding: 6px 14px; font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; }
.gclose:focus-visible, .gtoc:focus-visible { outline: 2px solid var(--g-fg); outline-offset: 2px; }
.gbody { max-width: 820px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); }
.gtocs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 26px; padding-bottom: 18px; border-bottom: 2px solid var(--g-fg); }
.gtoc { background: #fff; border: 1px solid var(--g-fg); color: var(--g-fg); padding: 5px 12px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; }
.gtoc:hover { background: var(--g-fg); color: #fff; }
.gbody section { margin-bottom: 34px; }
.gbody h2 { font-family: var(--f-display); font-weight: 800; font-size: 32px; letter-spacing: .05em; text-transform: uppercase; margin: 0 0 12px; padding-top: 6px; border-top: 5px solid var(--g-red); line-height: 1.1; }
.gbody p { margin: 0 0 12px; max-width: 70ch; }
.gbody ul, .gbody ol { margin: 0 0 14px; padding-left: 22px; max-width: 70ch; }
.gbody li { margin-bottom: 4px; }
.gbody b { font-weight: 700; }
.gscroll { overflow-x: auto; margin: 4px 0 16px; border: 1px solid var(--g-fg); }
.gbody table { color: var(--g-fg); border-collapse: collapse; width: 100%; font-size: 14px; min-width: 420px; }
.gbody th { background: var(--g-fg); color: #fff; text-align: left; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 7px 10px; font-weight: 600; }
.gbody td { color: var(--g-fg); padding: 7px 10px; border-top: 1px solid var(--g-line); vertical-align: top; }
.gbody tbody tr:nth-child(even) td { background: var(--g-soft); }

.bk-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
label.btn { display: inline-block; }
.bk-msg { margin-top: 8px; font-size: 14px; }
.bk-paste { min-height: 70px; font-family: var(--f-mono); font-size: 16px; }

/* Modal, toasts, level-up */
.veil { position: fixed; inset: 0; z-index: 60; background: rgba(5,4,4,.88); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.modal { width: min(500px, 100%); max-height: 100%; overflow-y: auto; }
.modal .row { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-top: 6px; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 70; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { background: var(--paper); color: var(--void); border-left: 6px solid var(--red); padding: 8px 12px; font-family: var(--f-mono); font-weight: 600; font-size: 13px; animation: tin .25s ease-out, tout .4s ease-in 2.6s forwards; }
.toast.bad { border-left-color: var(--bad); }
.toast.gold { border-left-color: var(--amber); }
@keyframes tin { from { transform: translateX(24px); opacity: 0; } }
@keyframes tout { to { opacity: 0; transform: translateY(8px); } }
.lvl { text-align: center; padding: 34px 20px; width: min(480px, 100%); }
.lvl .big { font-family: var(--f-display); font-weight: 800; font-size: 120px; line-height: .9; color: var(--red); text-shadow: 4px 4px 0 var(--paper); animation: shake .5s steps(2) 3; }
@keyframes shake { 0% { transform: translate(0); } 33% { transform: translate(-4px, 2px); } 66% { transform: translate(4px, -2px); } 100% { transform: translate(0); } }
@media (prefers-reduced-motion: reduce) {
  .toast, .lvl .big { animation: none; } .xpbar > i, .prog > i { transition: none; }
}
@media (max-width: 480px) {
  .gtitle { font-size: 19px; letter-spacing: .08em; white-space: nowrap; }
  .gbody h2 { font-size: 27px; }
  .badge { width: 56px; height: 56px; font-size: 32px; }
  .rank { font-size: 22px; }
  .tab { padding: 8px 14px; font-size: 15px; }
}
</style>

<body>
<div class="wrap">
  <header class="hud" id="hud"></header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Módulos"></nav>
  <main id="view"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="layer"></div>
<div id="guide"></div>
<script>
/* ===== Núcleo: constantes, estado e regras de jogo ===== */
const STORE_KEY = "netrunner-os-v1";
const isStandalone = () => { try { return window.top === window.self && !(window.claude && window.claude.use); } catch (e) { return false; } };
const DIFFS = [
  { n: 1, label: "Fácil", xp: 10 },
  { n: 2, label: "Média", xp: 20 },
  { n: 3, label: "Difícil", xp: 40 },
  { n: 4, label: "Épica", xp: 80 }
];
const ATTRS = [
  { id: "corpo", name: "CORPO" },
  { id: "mente", name: "MENTE" },
  { id: "social", name: "SOCIAL" },
  { id: "grana", name: "GRANA" },
  { id: "foco", name: "FOCO" }
];
const RANKS = [
  { min: 1, name: "Script Kiddie" },
  { min: 5, name: "Runner" },
  { min: 10, name: "Netrunner" },
  { min: 20, name: "Fantasma" },
  { min: 35, name: "Arquiteto" },
  { min: 50, name: "Lenda da Rede" }
];
const DOW = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"];
const TABS = [
  ["painel", "Painel"], ["habitos", "Hábitos"], ["missoes", "Missões"],
  ["metas", "Metas"], ["diario", "Diário"], ["loja", "Mercado"], ["perfil", "Perfil"]
];
const MOODS = [[5, "Ótimo"], [4, "Bem"], [3, "Normal"], [2, "Difícil"], [1, "Péssimo"]];

const ACHS = [
  { id: "a1", name: "Primeiro Ping", desc: "Conclua sua primeira ação.", bonus: 20, ok: s => s.stats.completed >= 1 },
  { id: "a10", name: "Conexão Estável", desc: "Conclua 10 ações.", bonus: 30, ok: s => s.stats.completed >= 10 },
  { id: "a100", name: "Overclock", desc: "Conclua 100 ações.", bonus: 150, ok: s => s.stats.completed >= 100 },
  { id: "s7", name: "Semana Limpa", desc: "Sequência de 7 dias em um hábito.", bonus: 50, ok: s => s.stats.bestStreak >= 7 },
  { id: "s21", name: "Rotina Instalada", desc: "Sequência de 21 dias.", bonus: 120, ok: s => s.stats.bestStreak >= 21 },
  { id: "s66", name: "Hábito Automático", desc: "Sequência de 66 dias.", bonus: 400, ok: s => s.stats.bestStreak >= 66 },
  { id: "l5", name: "Runner Licenciado", desc: "Chegue ao nível 5.", bonus: 60, ok: s => levelOf(s.xp).level >= 5 },
  { id: "l10", name: "Netrunner", desc: "Chegue ao nível 10.", bonus: 150, ok: s => levelOf(s.xp).level >= 10 },
  { id: "l25", name: "Fantasma da Rede", desc: "Chegue ao nível 25.", bonus: 500, ok: s => levelOf(s.xp).level >= 25 },
  { id: "g1", name: "Missão Cumprida", desc: "Conclua sua primeira meta.", bonus: 100, ok: s => s.stats.goalsDone >= 1 },
  { id: "p1", name: "Cliente do Mercado", desc: "Resgate uma recompensa.", bonus: 20, ok: s => s.stats.purchases >= 1 },
  { id: "pd", name: "Dia Perfeito", desc: "Complete todos os hábitos do dia (mín. 3).", bonus: 60, ok: s => s.stats.perfectDays >= 1 },
  { id: "d1", name: "Primeiro Registro", desc: "Escreva a primeira entrada no diário.", bonus: 20, ok: s => (s.diary || []).some(e => !e.ex) },
  { id: "d10", name: "Cronista", desc: "Escreva 10 entradas no diário.", bonus: 80, ok: s => (s.diary || []).filter(e => !e.ex).length >= 10 },
  { id: "at5", name: "Especialista", desc: "Leve um atributo ao nível 5.", bonus: 80, ok: s => ATTRS.some(a => attrLevel(s.attrs[a.id]) >= 5) }
];

/* Datas locais no formato AAAA-MM-DD */
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split("-").map(Number); return ymd(new Date(y, m - 1, d + n)); };
const dowOf = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).getDay(); };
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Curva de nível: custo para sair do nível L = 80 * L^1.35 */
const costOf = l => Math.round(80 * Math.pow(l, 1.35));
function levelOf(total) {
  let level = 1, rest = Math.max(0, total);
  while (rest >= costOf(level)) { rest -= costOf(level); level++; }
  return { level, into: rest, need: costOf(level) };
}
const levelStart = level => { let t = 0; for (let l = 1; l < level; l++) t += costOf(l); return t; };
const attrLevel = a => Math.floor(Math.sqrt(a.xp / 20)) + 1;
const rankOf = level => RANKS.filter(r => level >= r.min).pop();

/* Estado inicial com pacote de exemplo (editável e removível) */
function freshState(withExamples) {
  const s = {
    v: 1, name: "RUNNER", xp: 0, credits: 0, hp: 100, day: today(),
    attrs: {}, habits: [], tasks: [], goals: [], shop: [], diary: [], diaryXpDay: "", ach: {}, log: [], act: {},
    stats: { completed: 0, goalsDone: 0, purchases: 0, bestStreak: 0, perfectDays: 0 },
    example: !!withExamples
  };
  ATTRS.forEach(a => { s.attrs[a.id] = { xp: 0 }; });
  if (withExamples) {
    const all = [0, 1, 2, 3, 4, 5, 6];
    s.habits = [
      mkHabit("Beber 2 litros de água", "corpo", 1, all),
      mkHabit("Treino ou caminhada de 30 min", "corpo", 3, [1, 3, 5]),
      mkHabit("Estudar 45 minutos", "mente", 2, [1, 2, 3, 4, 5]),
      mkHabit("Revisar gastos do dia", "grana", 1, all)
    ];
    s.tasks = [
      mkTask("Definir as 3 prioridades da semana", "foco", 1, addDays(today(), 1)),
      mkTask("Ligar para alguém que não vejo há tempos", "social", 2, "")
    ];
    s.goals = [mkGoal("Lançar meu projeto paralelo", "grana", addDays(today(), 60),
      ["Definir a oferta", "Montar a página de venda", "Divulgar para 10 pessoas", "Primeira venda"])];
    s.shop = [
      { id: uid(), title: "Um episódio de série", cost: 40, bought: 0 },
      { id: uid(), title: "Sobremesa que eu gosto", cost: 120, bought: 0 },
      { id: uid(), title: "Sair para jantar", cost: 600, bought: 0 }
    ];
    s.diary = [{ id: uid(), date: today(), ts: Date.now(), mood: 4, ex: true,
      text: "Exemplo de entrada: hoje terminei a reunião mais cedo e consegui caminhar. Anote aqui o que aconteceu, o que você sentiu e o que quer lembrar." }];
  }
  return s;
}
const mkHabit = (title, attr, diff, days) => ({ id: uid(), title, attr, diff, days, streak: 0, best: 0, last: "", hist: [], undo: null, created: today() });
const mkTask = (title, attr, diff, due) => ({ id: uid(), title, attr, diff, due, done: false, gain: null });
const mkGoal = (title, attr, due, miles) => ({ id: uid(), title, attr, due, diff: 4, done: false, gain: null, miles: miles.map(t => ({ id: uid(), t, done: false, gain: null })) });

let S = freshState(true);
let ui = { tab: "painel", modal: null, confirm: "" };
const pendingLevelUps = [];

/* ----- XP, créditos e atributos ----- */
function gain(xp, attrId, why, mult) {
  const before = levelOf(S.xp).level;
  const total = Math.max(1, Math.round(xp * (mult || 1)));
  const cr = Math.max(1, Math.round(total / 2));
  S.xp += total; S.credits += cr;
  if (S.attrs[attrId]) S.attrs[attrId].xp += total;
  S.hp = Math.min(100, S.hp + 2);
  logIt(why, total, cr);
  toast("+" + total + " XP  +" + cr + " ¤", "");
  const after = levelOf(S.xp).level;
  for (let l = before + 1; l <= after; l++) pendingLevelUps.push(l);
  return { xp: total, cr, attr: attrId };
}
function revert(g) {
  if (!g) return;
  S.xp = Math.max(0, S.xp - g.xp);
  S.credits = Math.max(0, S.credits - g.cr);
  if (S.attrs[g.attr]) S.attrs[g.attr].xp = Math.max(0, S.attrs[g.attr].xp - g.xp);
  logIt("Desfeito", -g.xp, -g.cr);
}
function logIt(t, xp, cr) {
  S.log.unshift({ t, xp, cr, ts: Date.now() });
  if (S.log.length > 40) S.log.length = 40;
}
function bumpAct(delta) {
  const d = today();
  S.act[d] = Math.max(0, (S.act[d] || 0) + delta);
  const keys = Object.keys(S.act).sort();
  while (keys.length > 70) delete S.act[keys.shift()];
}

/* ----- Hábitos ----- */
const isDue = (h, d) => h.days.includes(dowOf(d)) && h.created <= d;
const doneOn = (h, d) => h.hist.includes(d);
function prevScheduled(h, d) {
  for (let i = 1; i <= 7; i++) { const p = addDays(d, -i); if (h.days.includes(dowOf(p))) return p; }
  return null;
}
function toggleHabit(id) {
  const h = S.habits.find(x => x.id === id); if (!h) return;
  const t = today();
  if (doneOn(h, t)) {
    if (h.undo) { h.streak = h.undo.streak; h.best = h.undo.best; h.last = h.undo.last; revert(h.undo.g); }
    h.hist = h.hist.filter(d => d !== t); h.undo = null;
    S.stats.completed = Math.max(0, S.stats.completed - 1); bumpAct(-1);
  } else {
    const prev = prevScheduled(h, t);
    const keeps = h.last && prev && h.last >= prev;
    const undo = { streak: h.streak, best: h.best, last: h.last };
    h.streak = keeps ? h.streak + 1 : 1;
    if (h.streak > h.best) h.best = h.streak;
    if (h.best > S.stats.bestStreak) S.stats.bestStreak = h.best;
    h.last = t; h.hist.push(t); if (h.hist.length > 90) h.hist.shift();
    const mult = 1 + Math.min(h.streak, 20) * 0.05;
    undo.g = gain(DIFFS[h.diff - 1].xp, h.attr, h.title + (h.streak > 1 ? " · x" + h.streak : ""), mult);
    h.undo = undo;
    S.stats.completed++; bumpAct(1);
    const due = S.habits.filter(x => isDue(x, t));
    if (due.length >= 3 && due.every(x => doneOn(x, t))) { S.stats.perfectDays++; toast("DIA PERFEITO", "gold"); }
  }
  afterChange();
}

/* Virada de dia: hábitos agendados e não feitos quebram a sequência e custam integridade */
function rollover() {
  const t = today();
  if (S.day >= t) return false;
  let d = S.day; let guard = 0; let missed = 0;
  while (d < t && guard++ < 14) {
    S.habits.forEach(h => {
      if (isDue(h, d) && !doneOn(h, d)) { h.streak = 0; missed++; }
    });
    d = addDays(d, 1);
  }
  S.day = t;
  if (missed) {
    S.hp -= missed * 8;
    toast("-" + missed * 8 + " integridade · " + missed + " hábito(s) perdido(s)", "bad");
    if (S.hp <= 0) {
      const lv = levelOf(S.xp); const lost = Math.round(lv.into * 0.25);
      S.xp -= lost; S.hp = 50;
      logIt("SISTEMA COLAPSOU", -lost, 0);
      toast("COLAPSO: -" + lost + " XP", "bad");
    }
  }
  return true;
}

/* ----- Missões e metas ----- */
function toggleTask(id) {
  const k = S.tasks.find(x => x.id === id); if (!k) return;
  if (k.done) {
    revert(k.gain); k.done = false; k.gain = null; S.stats.completed = Math.max(0, S.stats.completed - 1); bumpAct(-1);
  } else {
    const late = k.due && k.due < today();
    k.gain = gain(DIFFS[k.diff - 1].xp, k.attr, k.title, late ? 0.5 : 1);
    k.done = true; S.stats.completed++; bumpAct(1);
  }
  afterChange();
}
function toggleMile(gid, mid) {
  const g = S.goals.find(x => x.id === gid); if (!g || g.done) return;
  const m = g.miles.find(x => x.id === mid); if (!m) return;
  if (m.done) { revert(m.gain); m.done = false; m.gain = null; S.stats.completed = Math.max(0, S.stats.completed - 1); bumpAct(-1); }
  else { m.gain = gain(DIFFS[2].xp, g.attr, "Marco: " + m.t, 1); m.done = true; S.stats.completed++; bumpAct(1); }
  afterChange();
}
function finishGoal(gid) {
  const g = S.goals.find(x => x.id === gid); if (!g || g.done) return;
  if (g.miles.some(m => !m.done)) return;
  g.gain = gain(DIFFS[3].xp * 3, g.attr, "META CONCLUÍDA: " + g.title, 1);
  g.done = true; S.stats.goalsDone++; bumpAct(1);
  toast("META CONCLUÍDA", "gold");
  afterChange();
}
function reopenGoal(gid) {
  const g = S.goals.find(x => x.id === gid); if (!g || !g.done) return;
  revert(g.gain); g.done = false; g.gain = null; S.stats.goalsDone = Math.max(0, S.stats.goalsDone - 1);
  afterChange();
}

/* ----- Mercado ----- */
function buy(id) {
  const it = S.shop.find(x => x.id === id); if (!it) return;
  if (S.credits < it.cost) { toast("Créditos insuficientes", "bad"); return; }
  S.credits -= it.cost; it.bought++; S.stats.purchases++;
  logIt("Resgate: " + it.title, 0, -it.cost);
  toast("Resgatado: " + it.title, "gold");
  afterChange();
}

/* ----- Conquistas ----- */
function checkAch() {
  let again = true;
  while (again) {
    again = false;
    ACHS.forEach(a => {
      if (!S.ach[a.id] && a.ok(S)) {
        S.ach[a.id] = Date.now();
        toast("CONQUISTA: " + a.name + "  +" + a.bonus + " XP", "gold");
        const before = levelOf(S.xp).level;
        S.xp += a.bonus; S.credits += Math.round(a.bonus / 2);
        const after = levelOf(S.xp).level;
        for (let l = before + 1; l <= after; l++) pendingLevelUps.push(l);
        again = true;
      }
    });
  }
}
function afterChange() { checkAch(); persist(); render(); showLevelUp(); }
/* ===== Interface: HUD, abas e painéis ===== */
const $ = s => document.querySelector(s);
let syncLabel = "LOCAL";
const attrName = id => (ATTRS.find(a => a.id === id) || { name: id.toUpperCase() }).name;
const fmtDate = s => s ? s.slice(8, 10) + "/" + s.slice(5, 7) : "";
const diffDots = n => '<span class="diff" title="' + DIFFS[n - 1].label + '">' + [1, 2, 3, 4].map(i => '<i class="' + (i <= n ? "on" : "") + '"></i>').join("") + "</span>";

function toast(msg, kind) {
  const box = $("#toasts"); if (!box) return;
  const el = document.createElement("div");
  el.className = "toast " + (kind || ""); el.textContent = msg;
  box.appendChild(el);
  while (box.children.length > 4) box.removeChild(box.firstChild);

function radar() {
  const cx = 150, cy = 150, R = 100, n = ATTRS.length;
  const lv = ATTRS.map(a => attrLevel(S.attrs[a.id])), max = Math.max(5, ...lv);
  const pt = (i, r) => { const g = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(g), cy + r * Math.sin(g)]; };
  const poly = r => ATTRS.map((_, i) => pt(i, r).map(v => v.toFixed(1)).join(",")).join(" ");
  const val = ATTRS.map((_, i) => pt(i, R * lv[i] / max).map(v => v.toFixed(1)).join(",")).join(" ");
  const rings = [0.25, 0.5, 0.75, 1].map(f => '<polygon points="' + poly(R * f) + '" style="fill:none;stroke:var(--line)" stroke-width="1"/>').join("");
  const axes = ATTRS.map((_, i) => { const p = pt(i, R); return '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" style="stroke:var(--line)"/>'; }).join("");
  const labels = ATTRS.map((a, i) => { const p = pt(i, R + 22); return '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + 4).toFixed(1) + '" text-anchor="middle" font-size="11" style="fill:var(--dim);font-family:var(--f-mono);letter-spacing:.1em">' + a.name + ' ' + lv[i] + '</text>'; }).join("");
  return '<svg viewBox="0 0 300 300" style="width:100%;max-width:320px;display:block;margin:0 auto" role="img" aria-label="Radar de atributos">' + rings + axes +
    '<polygon points="' + val + '" style="fill:rgba(232,32,31,.35);stroke:var(--red)" stroke-width="2"/>' + labels + '</svg>';
}

function openGuide(jump) {
  const toc = GUIDE_SECTIONS.map(s => '<button class="gtoc" data-act="gjump" data-id="' + s[0] + '">' + s[1] + '</button>').join("");
  $("#guide").innerHTML = '<div class="guide" role="dialog" aria-modal="true" aria-label="Guia do usuário">' +
    '<div class="gbar"><div class="gbar-in"><span class="gtitle">GUIA DO USUÁRIO</span><button class="gclose" data-act="guide-close" id="gclose">Fechar ✕</button></div></div>' +
    '<div class="gbody" id="gbody"><nav class="gtocs" aria-label="Seções">' + toc + '</nav>' + guideHtml() + '</div></div>';
  document.body.style.overflow = "hidden";
  const b = $("#gclose"); if (b) b.focus();
  if (jump) gJump(jump);
}
function closeGuide() {
  const g = $("#guide"); if (!g || !g.innerHTML) return;
  g.innerHTML = ""; document.body.style.overflow = "";
}
function gJump(id) {
  const el = document.getElementById("g-" + id), box = document.querySelector(".guide");
  if (!el || !box) return;
  const bar = document.querySelector(".gbar");
  box.scrollTo({ top: el.offsetTop - (bar ? bar.offsetHeight : 56) - 8, behavior: "auto" });
}

const KIND_LABEL = { habit: "hábito", task: "missão", goal: "meta", shop: "recompensa", diary: "entrada" };
const LIST_OF = { habit: "habits", task: "tasks", goal: "goals", shop: "shop", diary: "diary" };
const opts = (arr, sel) => arr.map(o => '<option value="' + o[0] + '"' + (o[0] == sel ? " selected" : "") + '>' + o[1] + '</option>').join("");

function openModal(kind, id) {
  const it = id ? S[LIST_OF[kind]].find(x => x.id === id) : null;
  ui.modal = { kind, id: it ? it.id : null };
  const attrSel = '<label class="f"><span class="lbl">Atributo</span><select id="m-attr">' + opts(ATTRS.map(a => [a.id, a.name]), it ? it.attr : "foco") + '</select></label>';
  const diffSel = '<label class="f"><span class="lbl">Dificuldade</span><select id="m-diff">' + opts(DIFFS.map(d => [d.n, d.label + " · " + d.xp + " XP"]), it ? it.diff : 2) + '</select></label>';
  let fields = kind === "diary" ? "" : '<label class="f"><span class="lbl">Título</span><input type="text" id="m-title" maxlength="90" value="' + esc(it ? it.title : "") + '"></label>';
  if (kind === "diary") {
    const mood = it ? it.mood : 3;
    fields += '<label class="f"><span class="lbl">Data</span><input type="date" id="m-date" value="' + esc(it ? it.date : today()) + '" max="' + today() + '"></label>' +
      '<div class="f"><span class="lbl">Como foi o dia</span><div class="mood-row">' +
      MOODS.map(m => '<label><input type="radio" name="m-mood" value="' + m[0] + '"' + (m[0] === mood ? " checked" : "") + '><span>' + m[1] + '</span></label>').join("") + '</div></div>' +
      '<label class="f"><span class="lbl">O que aconteceu</span><textarea id="m-text" class="dtext" maxlength="4000">' + esc(it ? it.text : "") + '</textarea></label>';
  } else if (kind === "habit") {
    const days = it ? it.days : [0, 1, 2, 3, 4, 5, 6];
    fields += attrSel + diffSel + '<div class="f"><span class="lbl">Dias da semana</span><div class="days">' +
      DOW.map((d, i) => '<label><input type="checkbox" name="m-day" value="' + i + '"' + (days.includes(i) ? " checked" : "") + '><span>' + d + '</span></label>').join("") + '</div></div>';
  } else if (kind === "task") {
    fields += attrSel + diffSel + '<label class="f"><span class="lbl">Prazo (opcional)</span><input type="date" id="m-due" value="' + esc(it ? it.due : "") + '"></label>';
  } else if (kind === "goal") {
    fields += attrSel + '<label class="f"><span class="lbl">Prazo (opcional)</span><input type="date" id="m-due" value="' + esc(it ? it.due : "") + '"></label>' +

  } else {
    fields += '<label class="f"><span class="lbl">Custo em créditos</span><input type="number" id="m-cost" min="1" max="99999" value="' + (it ? it.cost : 100) + '"></label>';

    '<div class="row"><div>' + (it ? '<button type="button" class="btn warn" data-act="del">Excluir</button>' : "") + '</div><div style="display:flex;gap:8px"><button type="button" class="btn" data-act="cancel">Cancelar</button><button type="submit" class="btn pri">Salvar</button></div></div></form></div>';
  const f = $("#m-title"); if (f) f.focus();
}
function closeModal() { ui.modal = null; $("#layer").innerHTML = ""; }

function saveModal() {
  const m = ui.modal; if (!m) return;
  const tEl = $("#m-title");
  const title = tEl ? tEl.value.trim() : "";
  if (m.kind !== "diary" && !title) { $("#m-err").textContent = "Dê um título."; return; }
  const list = S[LIST_OF[m.kind]];
  let it = m.id ? list.find(x => x.id === m.id) : null;
  const val = id => { const e = $("#" + id); return e ? e.value : ""; };
  if (m.kind === "diary") {
    const text = val("m-text").trim();
    if (!text) { $("#m-err").textContent = "Escreva algo na entrada."; return; }
    const checked = document.querySelector('input[name="m-mood"]:checked');
    const date = val("m-date") || today();
    const mood = checked ? +checked.value : 3;
    if (it) { Object.assign(it, { text, date, mood, ex: false }); }
    else {
      list.push({ id: uid(), date, ts: Date.now(), mood, text, ex: false });
      if (S.diaryXpDay !== today()) { S.diaryXpDay = today(); gain(DIFFS[0].xp, "mente", "Diário"); }
    }
  } else if (m.kind === "habit") {
    const days = [...document.querySelectorAll('input[name="m-day"]:checked')].map(e => +e.value);
    if (!days.length) { $("#m-err").textContent = "Escolha ao menos um dia."; return; }
    if (it) Object.assign(it, { title, attr: val("m-attr"), diff: +val("m-diff"), days });
    else list.push(mkHabit(title, val("m-attr"), +val("m-diff"), days));
  } else if (m.kind === "task") {
    if (it) Object.assign(it, { title, attr: val("m-attr"), diff: +val("m-diff"), due: val("m-due") });
    else list.push(mkTask(title, val("m-attr"), +val("m-diff"), val("m-due")));
  } else if (m.kind === "goal") {
    const lines = val("m-miles").split("\n").map(s => s.trim()).filter(Boolean).slice(0, 20);
    if (it) {
      const old = it.miles;
      it.miles = lines.map(t => old.find(o => o.t === t) || { id: uid(), t, done: false, gain: null });
      Object.assign(it, { title, attr: val("m-attr"), due: val("m-due") });
    } else list.push(mkGoal(title, val("m-attr"), val("m-due"), lines));
  } else {
    const cost = Math.max(1, Math.min(99999, parseInt(val("m-cost"), 10) || 1));
    if (it) Object.assign(it, { title, cost });
    else list.push({ id: uid(), title, cost, bought: 0 });
  }
  closeModal(); afterChange();
}

  const first = pendingLevelUps[0], last = pendingLevelUps[pendingLevelUps.length - 1];
  pendingLevelUps.length = 0; lvlShown = true;
  const newRank = rankOf(last).name !== rankOf(first - 1).name;
  $("#lvl").innerHTML = '<div class="veil" role="dialog" aria-modal="true" aria-label="Subiu de nível"><div class="panel lvl">' +
    '<div class="lbl">NÍVEL ALCANÇADO</div><div class="big">' + last + '</div>' +
    '<h2 style="margin:12px 0 4px">' + rankOf(last).name.toUpperCase() + '</h2>' +
    '<div class="lbl" style="margin-bottom:18px">' + (newRank ? "NOVO RANK DESBLOQUEADO" : "SISTEMA ATUALIZADO") + '</div>' +
    '<button class="btn pri" data-act="lvl-close" id="lvlOk">Continuar</button></div></div>';
  const b = $("#lvlOk"); if (b) b.focus();
}

/* ----- Eventos ----- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "veil") { if (e.target === el) closeModal(); return; }
  switch (act) {
    case "tab": ui.tab = id; render(); window.scrollTo(0, 0); break;
    case "hab": toggleHabit(id); break;
    case "task": toggleTask(id); break;
    case "mile": toggleMile(id, el.dataset.m); break;
    case "finish": finishGoal(id); break;
    case "reopen": reopenGoal(id); break;
    case "buy": buy(id); break;
    case "new": openModal(el.dataset.kind, null); break;
    case "edit": openModal(el.dataset.kind, id); break;
    case "cancel": closeModal(); break;
    case "bk-export": exportBackup(); break;
    case "bk-import-text": { const t = $("#bk-text"); parseImport(t ? t.value : ""); break; }
    case "bk-confirm":
      if (ui.pendingImport) { S = normalize(ui.pendingImport.state); ui.pendingImport = null; rollover(); toast("Backup importado", "gold"); afterChange(); }
      break;
    case "bk-cancel": ui.pendingImport = null; render(); break;
    case "guide": openGuide(); break;
    case "guide-close": closeGuide(); break;
    case "gjump": gJump(id); break;
    case "del":
      if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = "Confirmar exclusão"; break; }
      { const m = ui.modal, l = S[LIST_OF[m.kind]], i = l.findIndex(x => x.id === m.id); if (i >= 0) l.splice(i, 1); closeModal(); afterChange(); }
      break;
    case "lvl-close": lvlShown = false; $("#lvl").innerHTML = ""; showLevelUp(); break;
    case "clear-examples": S.habits = []; S.tasks = []; S.goals = []; S.shop = []; S.diary = S.diary.filter(e => !e.ex); S.example = false; afterChange(); break;
    case "reset":
      if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = "Confirmar reset"; break; }
      S = freshState(false); ui.tab = "painel"; afterChange(); break;
  }
});
document.addEventListener("submit", e => { if (e.target.id === "mform") { e.preventDefault(); saveModal(); } });
document.addEventListener("change", e => {
  if (e.target.id === "bk-file") {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => parseImport(String(r.result || "")); r.onerror = () => toast("Não foi possível ler o arquivo", "bad"); r.readAsText(f);
    e.target.value = ""; return;
  }
  if (e.target.id === "pname") { S.name = e.target.value.trim().slice(0, 24) || "RUNNER"; persist(); renderHud(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (ui.modal) closeModal(); else closeGuide(); } });

/* ----- Backup em arquivo ----- */
async function exportBackup() {
  const payload = JSON.stringify({ app: "netrunner-os", v: 1, exportedAt: new Date().toISOString(), state: S }, null, 1);
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: "netrunner-backup-" + today() + ".json", data: payload }); toast("Backup salvo", "gold"); return; }
  } catch (e) { if (e && e.code === "declined") return; }
  if (isStandalone()) {
    try {
      const url = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
      const a = document.createElement("a"); a.href = url; a.download = "netrunner-backup-" + today() + ".json";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast("Backup baixado", "gold"); return;
    } catch (e) {}
  }
  try { await navigator.clipboard.writeText(payload); toast("Backup copiado. Cole em um app de notas.", "gold"); }
  catch (e) { toast("Não foi possível exportar o backup", "bad"); }
}
function parseImport(text) {
  let obj = null;
  try { obj = JSON.parse(String(text).trim()); } catch (e) {}
  const st = obj && obj.app === "netrunner-os" ? obj.state : null;
  if (!st || typeof st.xp !== "number" || !Array.isArray(st.habits)) { toast("Esse texto não é um backup do Netrunner OS", "bad"); return; }
  ui.pendingImport = { state: st }; render();
}

/* ----- Persistência: nuvem (db) com cópia local ----- */
let dbRef = null, saveT = null, saving = false, dirty = false;
function setSync(label) { syncLabel = label; renderHud(); }
function persist() {
  dirty = true; clearTimeout(saveT); saveT = setTimeout(flush, 700);
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ savedAt: Date.now(), state: S })); } catch (e) {}
}
async function flush() {
  if (!dirty) return;
  if (saving) { setTimeout(flush, 400); return; }
  dirty = false; saving = true;
  if (dbRef) {
    try { await dbRef.set({ state: JSON.parse(JSON.stringify(S)), savedAt: Date.now() }); if (syncLabel !== "NUVEM") setSync("NUVEM"); }
    catch (err) { setSync("OFFLINE"); }
  }
  saving = false;
}
function normalize(raw) {
  const s = Object.assign(freshState(false), raw);
  ATTRS.forEach(a => { if (!s.attrs[a.id]) s.attrs[a.id] = { xp: 0 }; });
  if (!Array.isArray(s.diary)) s.diary = [];
  if (typeof s.diaryXpDay !== "string") s.diaryXpDay = "";
  s.stats = Object.assign({ completed: 0, goalsDone: 0, purchases: 0, bestStreak: 0, perfectDays: 0 }, s.stats);
  return s;
}

async function init() {
  const d = document.createElement("div"); d.id = "lvl"; document.body.appendChild(d);
  render();
  for (let i = 0; i < 20 && !isStandalone() && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));
  let cloud = null, local = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) local = JSON.parse(raw); } catch (e) {}
  try {
    if (window.claude && window.claude.use) {
      const user = await window.claude.use("user"), db = await window.claude.use("db");
      const id = user ? await user.id() : null;
      if (db && id) {
        dbRef = db.doc("data/users/" + id + "/save");
        const snap = await dbRef.get();
        if (snap.exists) cloud = JSON.parse(JSON.stringify(snap.data()));
        syncLabel = "NUVEM";
      }
    }
  } catch (e) { dbRef = null; syncLabel = "LOCAL"; }
  const pick = cloud && local ? (cloud.savedAt >= local.savedAt ? cloud : local) : (cloud || local);
  const found = !!(pick && pick.state);
  if (found) S = normalize(pick.state);
  const rolled = rollover();
  checkAch(); render(); showLevelUp();
  if (!found || rolled) persist();
  setInterval(() => { if (rollover()) { persist(); render(); } }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && rollover()) { persist(); render(); } });
}
init();
</script>
